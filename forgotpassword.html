<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperar senha - Retropixel Pulse™</title>
<link rel="icon" type="image/png" href="assets/Pulse_icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#39b435">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="background"></div>

<header class="topbar">
    <div class="logo-area">
        <img src="assets/Pulse_logo.png" alt="Retropixel Pulse" class="logo">
        <div>
            <h1>Retropixel Pulse™</h1>
            <p>Recuperação de senha</p>
        </div>
    </div>
</header>

<main class="setup-container">

    <div class="setup-card">

        <h2>🔑 Recuperar senha</h2>

        <p class="description">
            Digite o e-mail da sua conta e enviaremos um link para redefinir sua senha. Se o e-mail não aparecer
          na sua inbox, tente checar a pasta de spam e marque como "Não é spam".
        </p>

        <section>
            <h3>📧 E-mail</h3>
            <input
            type="email"
            id="email"
            placeholder="Digite o e-mail da sua conta"
            autocomplete="email">
        </section>

        <button id="sendButton" class="continue-btn">
            📩 Enviar link de recuperação
        </button>

        <button
        id="backButton"
        class="primary-btn"
        style="margin-top:12px; width:100%;">
            ← Voltar para entrar
        </button>

        <p
        id="message"
        class="description"
        style="margin-top:18px; display:none;">
        </p>

    </div>

</main>

<script type="module">

import { app }
from "./firebase/firebase-config.js";

import {
    getAuth,
    sendPasswordResetEmail
}
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

const auth = getAuth(app);

const emailInput =
document.getElementById("email");

const sendButton =
document.getElementById("sendButton");

const backButton =
document.getElementById("backButton");

const message =
document.getElementById("message");

sendButton.addEventListener(
    "click",
    async () => {

        const email =
        emailInput.value.trim();

        if(email === ""){

            alert("Digite o e-mail da sua conta.");
            return;

        }

        if(
            !email.includes("@") ||
            !email.includes(".")
        ){

            alert("Digite um e-mail válido.");
            return;

        }

        sendButton.disabled = true;
        sendButton.textContent = "📨 Enviando...";

        try{

            await sendPasswordResetEmail(
                auth,
                email
            );

            message.style.display = "block";
            message.textContent =
            "✅ Link enviado! Verifique sua caixa de entrada e também a pasta de spam.";

            emailInput.value = "";

        }
        catch(error){

            console.error(
                "Erro ao enviar recuperação de senha:",
                error
            );

            if(
                error.code ===
                "auth/user-not-found"
            ){

                message.textContent =
                "❌ Não encontramos uma conta com esse e-mail.";

            }
            else if(
                error.code ===
                "auth/invalid-email"
            ){

                message.textContent =
                "❌ O e-mail informado é inválido.";

            }
            else if(
                error.code ===
                "auth/too-many-requests"
            ){

                message.textContent =
                "❌ Muitas tentativas. Aguarde um pouco e tente novamente.";

            }
            else{

                message.textContent =
                "❌ Não foi possível enviar o link. Tente novamente.";

            }

            message.style.display = "block";

        }
        finally{

            sendButton.disabled = false;
            sendButton.textContent =
            "📩 Enviar link de recuperação";

        }

    }
);

backButton.addEventListener(
    "click",
    () => {

        window.location.href =
        "index.html";

    }
);

if("serviceWorker" in navigator){

    window.addEventListener(
        "load",
        async () => {

            try{

                await navigator.serviceWorker.register(
                    "./sw.js"
                );

            }
            catch(error){

                console.error(
                    "Erro ao registrar Service Worker:",
                    error
                );

            }

        }
    );

}

</script>

</body>
</html>
